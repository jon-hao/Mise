<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Mise — 清新家常菜谱，支持菜名模糊搜索与多食材筛选"
    />
    <title>Mise · 菜谱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div class="brand-row">
          <h1 class="brand">Mi<span>se</span></h1>
          <div class="stats">
            <div class="stat"><strong id="recipeCount">—</strong> 道菜</div>
            <div class="stat"><strong id="ingCount">—</strong> 种食材</div>
          </div>
        </div>
        <p class="tagline">
          打开冰箱就能做。用菜名或手头食材，快速找到家常做法。
        </p>
      </header>

      <section class="panel" aria-label="搜索">
        <div class="search-grid">
          <div class="field">
            <label for="nameSearch">菜名搜索</label>
            <div class="input-wrap">
              <input
                id="nameSearch"
                type="search"
                placeholder="试试「土豆丝」「番茄炒蛋」「宫保」"
                autocomplete="off"
              />
              <div id="nameSuggest" class="suggest" role="listbox"></div>
            </div>
            <p class="hint">支持俗称与模糊匹配，如土豆丝、番茄炒蛋、宫爆鸡丁</p>
          </div>

          <div class="field">
            <label for="ingSearch">食材多选</label>
            <div class="input-wrap">
              <input
                id="ingSearch"
                type="search"
                placeholder="输入食材，如「土豆」「虾」「豆腐」"
                autocomplete="off"
              />
              <div id="ingSuggest" class="suggest" role="listbox"></div>
            </div>
            <div id="selectedIngs" class="chips" aria-live="polite"></div>
            <p class="hint">可多选；结果需同时包含所选食材（马铃薯=土豆）</p>
          </div>
        </div>

        <div id="facets" class="facets" aria-label="筛选维度"></div>
      </section>

      <div class="toolbar">
        <div>
          <h2>菜谱</h2>
          <div class="meta" id="resultMeta">加载中…</div>
        </div>
        <button type="button" class="clear-btn" id="clearFilters">清除筛选</button>
      </div>

      <main id="results" class="grid" aria-live="polite"></main>

      <footer>
        Mise · 家常菜谱手册 ·
        <a href="https://github.com/jon-hao/Mise">GitHub</a>
      </footer>
    </div>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      <button id="closeModal" class="close-btn" style="display: none" type="button">
        ×
      </button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
