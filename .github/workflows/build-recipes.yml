name: Build recipes from txt

# 可选：同步生成 data/recipes.json 作为回退。
# 网站已直接读取 recipes.txt，即使本工作流失败也不影响上线。

on:
  push:
    branches: [main]
    paths:
      - recipes.txt
      - scripts/build-recipes.py
      - .github/workflows/build-recipes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build recipes.json
        run: python3 scripts/build-recipes.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: rebuild recipes.json from recipes.txt"
            git push
          fi
